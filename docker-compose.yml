
# Stack de medios auto-hospedado, adaptado para correr detrás del Traefik de Coolify.
#
# Diferencias con el upstream (Pelado-Nerdworks/media-stack):
#   - Ningún servicio publica puertos del host: Traefik ya ocupa 80/443/8080.
#     El acceso entra por Traefik y se rutea por dominio a los containers.
#   - Sin `container_name`: Coolify los reescribe a <servicio>-<uuid>. El Caddyfile
#     sigue funcionando porque referencia nombres de servicio, que Docker mantiene
#     como alias de red.
#   - Volúmenes nombrados en vez de bind mounts para config y data.
#   - Servicio `init` que prepara /data y siembra la config de qBittorrent.
#
# Dominios (se configuran en Coolify, no acá):
#   caddy       → https://media.<dominio>   → subpaths /jellyfin /sonarr /radarr /bazarr /jellyseerr /wizarr
#   qbittorrent → https://qbit.<dominio>
#   jackett     → https://jackett.<dominio>
#   flaresolverr: sin dominio, solo alcanzable dentro de la red del stack.
#
# ─── Data layout (TRaSH Guides) ────────────────────────────────────────────────
# El volumen `media_data` se monta entero en /data en todos los servicios que
# tocan biblioteca o descargas. Es lo que permite que los *arr hagan hardlinks
# y moves atómicos entre /data/torrents y /data/media en vez de copiar todo dos
# veces. Ver docs/DATA_LAYOUT.md


services:
  # === Init one-shot ===
  # Los volúmenes nombrados arrancan vacíos y propiedad de root; las imágenes
  # LSIO corren como UID 1000. Este servicio crea el layout de /data, lo chownea,
  # y siembra la config de qBittorrent para que su WebUI acepte requests que
  # llegan con un Host distinto de localhost (si no, quedás fuera sin forma de
  # arreglarlo desde la propia UI).
  init:
    image: alpine:3.20
    restart: "no"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - media_data:/data
      - qbittorrent_config:/config
    command:
      - sh
      - -c
      - |
        set -e
        for kind in movies series music; do
          mkdir -p "/data/torrents/$$kind" "/data/media/$$kind"
        done
        chown -R "$${PUID}:$${PGID}" /data
        if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
          mkdir -p /config/qBittorrent
          printf '%s\n' '[Preferences]' 'WebUI\HostHeaderValidation=false' 'WebUI\CSRFProtection=false' \
            > /config/qBittorrent/qBittorrent.conf
          chown -R "$${PUID}:$${PGID}" /config
          echo "qBittorrent.conf sembrado"
        else
          echo "qBittorrent.conf ya existe, no se toca"
        fi
        echo "init OK"
    networks:
      - proxy

  # === Base URLs para los subpaths ===
  # Mismo trabajo que scripts/configure-base-urls.sh, pero editando los ficheros
  # de config directamente en los volúmenes en vez de por `docker exec`, que no
  # es viable dentro de Coolify. Espera a que cada app genere su config en el
  # primer arranque, la parchea y sale. Idempotente: en los redeploys siguientes
  # encuentra el valor ya puesto y no toca nada.
  baseurls:
    image: alpine:3.20
    restart: "no"
    volumes:
      - sonarr_config:/cfg/sonarr
      - radarr_config:/cfg/radarr
      - bazarr_config:/cfg/bazarr
      - jellyfin_config:/cfg/jellyfin
    command:
      - sh
      - -c
      - |
        set -u
        wait_for() {
          f="$$1"; n=0
          while [ ! -f "$$f" ] && [ $$n -lt 240 ]; do sleep 2; n=$$((n+1)); done
          [ -f "$$f" ] || { echo "TIMEOUT esperando $$f"; return 1; }
        }
        # *arr: <UrlBase></UrlBase> en config.xml
        for app in sonarr radarr; do
          f="/cfg/$$app/config.xml"
          wait_for "$$f" || continue
          if grep -q "<UrlBase>/$$app</UrlBase>" "$$f"; then
            echo "$$app: UrlBase ya estaba en /$$app"
          elif grep -q "<UrlBase></UrlBase>" "$$f"; then
            sed -i "s|<UrlBase></UrlBase>|<UrlBase>/$$app</UrlBase>|" "$$f"
            echo "$$app: UrlBase -> /$$app"
          else
            echo "$$app: WARN no encontre <UrlBase></UrlBase>, revisar a mano"
          fi
        done
        # Bazarr: url_base en config.yaml (la imagen LSIO lo pone en /config/config/)
        f=/cfg/bazarr/config/config.yaml
        if wait_for "$$f"; then
          if grep -qE "^ *base_url: */bazarr *$$" "$$f"; then
            echo "bazarr: base_url ya estaba en /bazarr"
          elif grep -qE "^ *base_url:" "$$f"; then
            sed -i "s|^\( *\)base_url:.*|\1base_url: /bazarr|" "$$f"
            echo "bazarr: base_url -> /bazarr"
          else
            echo "bazarr: WARN no encontre base_url en config.yaml, ponelo a mano en Settings > General"
          fi
        fi
        # Jellyfin: <BaseUrl> en network.xml, puede no existir el tag
        f=/cfg/jellyfin/network.xml
        if wait_for "$$f"; then
          if grep -q "<BaseUrl>/jellyfin</BaseUrl>" "$$f"; then
            echo "jellyfin: BaseUrl ya estaba en /jellyfin"
          elif grep -q "<BaseUrl></BaseUrl>" "$$f"; then
            sed -i "s|<BaseUrl></BaseUrl>|<BaseUrl>/jellyfin</BaseUrl>|" "$$f"
            echo "jellyfin: BaseUrl -> /jellyfin"
          elif grep -q "<BaseUrl>" "$$f"; then
            sed -i "s|<BaseUrl>.*</BaseUrl>|<BaseUrl>/jellyfin</BaseUrl>|" "$$f"
            echo "jellyfin: BaseUrl reemplazado por /jellyfin"
          else
            sed -i "s|</NetworkConfiguration>|  <BaseUrl>/jellyfin</BaseUrl>\n</NetworkConfiguration>|" "$$f"
            echo "jellyfin: BaseUrl insertado (no existia el tag)"
          fi
        fi
        echo "baseurls OK"
    networks:
      - proxy

  # === Cableado entre apps ===
  # Lee las API keys de los volúmenes de config y hace las llamadas por la red
  # interna, para que las claves no salgan del servidor. Idempotente: comprueba
  # lo que ya existe antes de crear nada.
  wiring:
    image: alpine:3.20
    restart: "no"
    volumes:
      - sonarr_config:/cfg/sonarr
      - radarr_config:/cfg/radarr
      - qbittorrent_config:/cfg/qbittorrent
    command:
      - sh
      - -c
      - |
        set -u
        apk add --no-cache curl jq >/dev/null 2>&1 || { echo "no pude instalar curl/jq"; exit 1; }

        # --- 1. qBittorrent: permitir que los *arr entren sin credenciales
        #     desde la red de Docker (la WebUI publica sigue pidiendo login).
        QB=/cfg/qbittorrent/qBittorrent/qBittorrent.conf
        if [ -f "$$QB" ]; then
          if grep -q "AuthSubnetWhitelistEnabled" "$$QB"; then
            echo "qbit: whitelist ya configurada"
          else
            printf '%s\n' 'WebUI\AuthSubnetWhitelistEnabled=true' 'WebUI\AuthSubnetWhitelist=172.16.0.0/12' >> "$$QB"
            echo "qbit: whitelist de red interna añadida (necesita restart)"
          fi
        else
          echo "qbit: WARN no encuentro qBittorrent.conf"
        fi

        # --- 2. API keys de Sonarr y Radarr
        for app in sonarr radarr; do
          f="/cfg/$$app/config.xml"; n=0
          while [ ! -f "$$f" ] && [ $$n -lt 120 ]; do sleep 2; n=$$((n+1)); done
        done
        SK=$$(sed -n 's|.*<ApiKey>\(.*\)</ApiKey>.*|\1|p' /cfg/sonarr/config.xml 2>/dev/null)
        RK=$$(sed -n 's|.*<ApiKey>\(.*\)</ApiKey>.*|\1|p' /cfg/radarr/config.xml 2>/dev/null)
        [ -n "$$SK" ] && echo "sonarr: API key leida" || echo "sonarr: WARN sin API key"
        [ -n "$$RK" ] && echo "radarr: API key leida" || echo "radarr: WARN sin API key"

        # --- 3. qBittorrent: ruta de descarga en /data/torrents
        QBUP=$$(curl -s -o /dev/null -w '%{http_code}' -m 10 "http://qbittorrent:8080/api/v2/app/version")
        if [ "$$QBUP" = "200" ]; then
          curl -s -m 10 -X POST "http://qbittorrent:8080/api/v2/app/setPreferences" \
            --data-urlencode 'json={"save_path":"/data/torrents","temp_path_enabled":false,"auto_tmm_enabled":true}' >/dev/null
          echo "qbit: save_path -> /data/torrents"
        else
          echo "qbit: aun pide auth (HTTP $$QBUP) — hace falta un restart para que aplique la whitelist"
        fi

        # --- 4. Download client y root folder en Sonarr y Radarr
        wire() {
          app="$$1"; port="$$2"; key="$$3"; ver="$$4"; cat_="$$5"; root="$$6"
          [ -n "$$key" ] || return 0
          base="http://$$app:$$port/$$app/api/$$ver"
          n=0
          until curl -s -o /dev/null -m 5 "$$base/system/status?apikey=$$key"; do
            n=$$((n+1)); [ $$n -gt 60 ] && { echo "$$app: TIMEOUT esperando la API"; return 1; }; sleep 3
          done
          if curl -s -m 10 "$$base/downloadclient?apikey=$$key" | grep -q '"name":"qBittorrent"'; then
            echo "$$app: download client ya existia"
          else
            curl -s -m 15 -X POST "$$base/downloadclient?apikey=$$key" -H "Content-Type: application/json" -d "{
              \"enable\":true,\"protocol\":\"torrent\",\"priority\":1,
              \"name\":\"qBittorrent\",\"implementation\":\"QBittorrent\",
              \"configContract\":\"QBittorrentSettings\",
              \"fields\":[
                {\"name\":\"host\",\"value\":\"qbittorrent\"},
                {\"name\":\"port\",\"value\":8080},
                {\"name\":\"useSsl\",\"value\":false},
                {\"name\":\"urlBase\",\"value\":\"\"},
                {\"name\":\"username\",\"value\":\"\"},
                {\"name\":\"password\",\"value\":\"\"},
                {\"name\":\"movieCategory\",\"value\":\"$$cat_\"},
                {\"name\":\"tvCategory\",\"value\":\"$$cat_\"}
              ]}" >/dev/null && echo "$$app: download client qBittorrent creado (categoria $$cat_)"
          fi
          if curl -s -m 10 "$$base/rootfolder?apikey=$$key" | grep -q "\"path\":\"$$root\""; then
            echo "$$app: root folder ya existia"
          else
            curl -s -m 15 -X POST "$$base/rootfolder?apikey=$$key" -H "Content-Type: application/json" \
              -d "{\"path\":\"$$root\"}" >/dev/null && echo "$$app: root folder $$root creado"
          fi
        }
        wire sonarr 8989 "$$SK" v3 tv-sonarr /data/media/series
        wire radarr 7878 "$$RK" v3 radarr     /data/media/movies
        echo "wiring OK"
    networks:
      - proxy

  # === Reverse proxy (Caddy con Caddyfile estático) ===
  # Sin `ports`: Traefik le habla por la red de Docker al puerto 80 del container.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # El Caddyfile va INLINE, no como bind mount: Coolify no deja el clon del
    # repo en el host para apps dockercompose, así que `./caddy/Caddyfile` monta
    # un directorio vacío y el container no arranca. caddy/Caddyfile se mantiene
    # en el repo como copia legible — si tocás uno, tocá el otro.
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'CADDYFILE'
        {
            # Sin dominio real, sólo HTTP en :80 para el demo.
            auto_https off
            admin off
        }
        
        :80 {
            # === Apps CON UrlBase / APPLICATION_ROOT configurado ===
            # El proxy NO strippea el prefijo: la app sabe su base
            # y sirve las URLs internas con el prefijo incluido.
        
            @sonarr path /sonarr*
            handle @sonarr {
                reverse_proxy sonarr:8989
            }
        
            @radarr path /radarr*
            handle @radarr {
                reverse_proxy radarr:7878
            }
        
            @bazarr path /bazarr*
            handle @bazarr {
                reverse_proxy bazarr:6767
            }
        
            @jellyfin path /jellyfin*
            handle @jellyfin {
                reverse_proxy jellyfin:8096
            }
        
            # Wizarr custom de pablokbs con APPLICATION_ROOT=/wizarr.
            @wizarr path /wizarr*
            handle @wizarr {
                reverse_proxy wizarr:5690
            }
        
            # === Apps SIN soporte de subpath (strippeamos prefijo) ===
        
            # qBittorrent NO va por aca: se expone directo en :8080 del host
            # (ver el puerto en docker-compose.yml). No soporta subpath de forma
            # estable porque sus URLs internas son relativas y se rompen cuando
            # Caddy strippea el prefijo.
        
            # Jellyseerr: redirect interno va a /setup, no respeta subpath.
            @jellyseerr path /jellyseerr*
            handle_path /jellyseerr* {
                reverse_proxy jellyseerr:5055
            }
            # Catch-all para assets/redirects internos de Jellyseerr.
            @jellyseerr-assets path /api/* /_next/* /logo* /favicon* /apple-* /site.webmanifest /setup* /login* /css/* /js/* /images/*
            handle @jellyseerr-assets {
                reverse_proxy jellyseerr:5055
            }
        
            # Health check
            handle /healthz {
                respond "ok"
            }
        
            # Catch-all 404 con mensaje amigable
            handle {
                respond "Not found. Try /jellyfin, /sonarr, /radarr, /bazarr, /jellyseerr, /wizarr. qBittorrent esta en :8080. Jackett en :9117. FlareSolverr en :8191." 404
            }
        }
        CADDYFILE
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - proxy

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    expose:
      - "9117"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - AUTO_UPDATE=true
    volumes:
      - jackett_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - proxy

  # === FlareSolverr (resuelve challenges de Cloudflare para indexers) ===
  # Sin dominio: solo lo consume Jackett desde adentro de la red.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    networks:
      - proxy

  # === TV shows ===
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - sonarr_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - proxy

  # === Movies ===
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - radarr_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - proxy

  # === Subtitles ===
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - bazarr_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
    networks:
      - proxy

  # === Downloads ===
  # No va por subpath de Caddy: sus URLs internas son relativas y se rompen
  # cuando el proxy strippea el prefijo. Sale por Traefik en su propio subdominio.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - proxy

  # === Media server ===
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - JELLYFIN_PublishedServerUrl=${PUBLIC_URL:-http://localhost}/jellyfin
    volumes:
      - jellyfin_config:/config
      - media_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - proxy

  # === Request management ===
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - LOG_LEVEL=info
    volumes:
      - jellyseerr_config:/app/config
    networks:
      - proxy

  # === User invitation system ===
  # Imagen custom de pablokbs con APPLICATION_ROOT funcionando.
  wizarr:
    image: docker.io/pablokbs/wizarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - APPLICATION_ROOT=/wizarr
    volumes:
      - wizarr_config:/config
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  # Biblioteca + descargas, compartido para que los hardlinks funcionen.
  media_data:
  # Configs por app.
  caddy_data:
  caddy_config:
  jackett_config:
  sonarr_config:
  radarr_config:
  bazarr_config:
  qbittorrent_config:
  jellyfin_config:
  jellyseerr_config:
  wizarr_config:
